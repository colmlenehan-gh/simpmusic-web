<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><meta name="description" content="An unofficial open-source SimpMusic browser adaptation. Listen to local music and YouTube embeds, manage playlists, and read lyrics."><title>SimpMusic Web</title><link rel="icon" href="assets/icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=0.1.1"></head>
<body><a class="skip" href="#main">Skip to music</a><div class="shell"><aside class="sidebar"><a class="brand" href="#home"><img src="assets/icon.png" alt=""><strong>SimpMusic</strong><small>WEB</small></a><nav aria-label="Main navigation"><a href="#home" data-nav="home"><span>⌂</span>Home</a><a href="#mix" data-nav="mix"><span>◉</span>Mix</a><a href="#analytics" data-nav="analytics"><span>⌁</span>Analytics</a><a href="#search" data-nav="search"><span>⌕</span>Search</a></nav><div class="library-title"><a href="#library">▣ &nbsp; Your library</a><button data-action="new-playlist" aria-label="Create playlist">＋</button></div><div class="library-filters"><a href="#library">Playlists</a><a href="#local">On device</a></div><div id="library-nav"></div><div class="sidebar-bottom"><button data-action="import">＋ Import music</button><a href="#settings">⚙ &nbsp; Settings</a><small>Unofficial browser adaptation</small></div></aside><main id="main" tabindex="-1"><header><div class="top-left"><span class="avatar">S</span><a class="chip selected" href="#home">All</a><a class="chip" href="#moods">Mood</a></div><div class="top-actions"><button data-action="add-youtube" aria-label="Add YouTube video">＋</button><a href="#settings" aria-label="Settings">⚙</a></div></header><section id="view"></section></main><aside id="now-panel" aria-label="Now playing"><div class="panel-heading"><strong>Now playing</strong><button data-action="close-panel" aria-label="Close now playing">×</button></div><div id="video-wrap"><div id="youtube-player"></div></div><p id="playback-status" class="subheading hidden" role="status"></p><div id="now-art" class="art large-art"></div><div class="now-title"><div><h2 id="now-title">Your music, your way.</h2><p id="now-artist">Choose a song to begin</p></div><button id="panel-like" data-action="like-current" aria-label="Like current song">♡</button></div><div class="panel-tabs"><button data-panel="lyrics" class="selected">Lyrics</button><button data-panel="queue">Up next</button><button data-panel="details">Details</button></div><div id="panel-content"><p class="muted">Play a song to see its lyrics and queue.</p></div></aside></div>
<footer class="player" aria-label="Music player"><button class="track-summary" data-action="toggle-panel"><span id="mini-art" class="art"></span><span><strong id="mini-title">Nothing playing</strong><small id="mini-artist">Import music or choose a video</small></span></button><div class="transport"><div class="transport-buttons"><button id="shuffle" data-action="shuffle" aria-label="Shuffle" aria-pressed="false">⤨</button><button data-action="previous" aria-label="Previous track">⏮</button><button id="play" class="play" data-action="play" aria-label="Play">▶</button><button data-action="next" aria-label="Next track">⏭</button><button id="repeat" data-action="repeat" aria-label="Repeat: off">↪</button></div><div class="timeline"><small id="elapsed">0:00</small><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback position"><small id="duration">0:00</small></div></div><div class="player-extras"><button id="mini-like" data-action="like-current" aria-label="Like current song">♡</button><button data-action="show-queue" aria-label="Show queue">☷</button><button data-action="toggle-panel" aria-label="Show now playing">▣</button><label class="volume">♪ <input id="volume" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Volume"></label></div></footer><nav class="mobile-nav" aria-label="Mobile navigation"><a href="#home">⌂<small>Home</small></a><a href="#search">⌕<small>Search</small></a><a href="#library">▣<small>Library</small></a><a href="#settings">⚙<small>Settings</small></a></nav><dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" data-action="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-content"></div><div class="dialog-actions"><button type="button" data-action="close-dialog">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><input type="file" id="music-files" accept="audio/*" multiple hidden><input type="file" id="backup-file" accept="application/json,.json" hidden><input type="file" id="lrc-file" accept=".lrc,.txt" hidden><audio id="audio" preload="metadata"></audio><script type="module" src="app.js?v=0.1.1"></script></body></html>
